schema_version: "1.0"

preset:
  id: "osceia"
  name: "OSCEIA / Fóton — PT-BR"
  version: "1.0.0"
  description: "Localiza o Spec Kit para português do Brasil e aplica os padrões técnicos e de conformidade da OSCEIA/Fóton (Angular standalone + signals + PrimeNG, Laravel/Filament, WCAG 2.1 AA, LGPD)."
  author: "fulviofb"
  license: "MIT"

requires:
  speckit_version: ">=0.6.0"

provides:
  templates:
    # Sobrescreve o template de especificação com versão PT-BR contendo
    # seções obrigatórias de Acessibilidade (WCAG AA) e Privacidade (LGPD).
    - type: "template"
      name: "spec-template"
      file: "templates/spec-template.md"
      description: "Template de especificação em PT-BR com seções de acessibilidade e LGPD"
      replaces: "spec-template"

    # Sobrescreve o template de tarefas com versão PT-BR que injeta as
    # Fases de Conformidade obrigatórias: gate de acessibilidade (AXE/WCAG AA)
    # e revisão LGPD em todo tasks.md gerado.
    - type: "template"
      name: "tasks-template"
      file: "templates/tasks-template.md"
      description: "Template de tarefas em PT-BR com gates obrigatórios de acessibilidade e LGPD"
      replaces: "tasks-template"

tags:
  - "pt-br"
  - "osceia"
  - "foton"
  - "angular"
  - "laravel"
  - "acessibilidade"
  - "lgpd"
